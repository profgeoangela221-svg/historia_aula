<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Quiz · Bloco 4 · Brasil República</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Verdana', 'Arial', sans-serif; background: #f5f7f6; color: #1a2e2a; line-height: 1.4; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 12px; }
        .quiz-wrapper { width: 100%; max-width: 85%; margin: 0 auto; background: white; border-radius: 28px; box-shadow: 0 12px 28px rgba(0,0,0,0.04); padding: 20px 30px; border: 1px solid #dde5e0; }
        .screen { display: none; } .screen.active { display: block; }
        .intro-card { text-align: center; }
        .intro-card h1 { font-size: 2.2rem; font-weight: 700; color: #0f3d2e; margin-bottom: 20px; }
        .intro-card .revisao { font-size: 1.4rem; color: #2a5e4a; margin-bottom: 12px; font-weight: 600; }
        .intro-card .professora { font-size: 1.2rem; color: #1a5e44; margin-bottom: 40px; font-style: italic; }
        .intro-card .btn-iniciar { background: #1a5e44; color: white; border: none; padding: 18px 40px; font-size: 1.4rem; font-weight: bold; border-radius: 60px; cursor: pointer; margin-top: 20px; transition: transform 0.2s; }
        .intro-card .btn-iniciar:hover { background: #0f4a35; transform: scale(1.02); }
        .title { font-size: 1.7rem; font-weight: 700; color: #0f3d2e; margin-bottom: 8px; text-align: center; }
        .sub { text-align: center; color: #2a5e4a; margin-bottom: 20px; font-style: italic; }
        .progress-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.9rem; font-weight: 600; color: #1a5e44; margin-bottom: 8px; }
        .progress-bar-bg { background: #dee6e1; height: 8px; border-radius: 20px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { background: #1a7a58; height: 8px; width: 0%; border-radius: 20px; transition: width 0.2s; }
        .question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 25px; line-height: 1.5; text-align: center; background: #f0f7f3; padding: 20px; border-radius: 20px; }
        .options { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
        .opt-btn { background: #ecf3ef; border: 2px solid #b3cdbf; padding: 14px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 60px; cursor: pointer; transition: 0.1s; text-align: center; min-width: 150px; font-family: inherit; }
        .opt-btn:hover { background: #dce8e0; transform: scale(1.02); }
        .opt-btn.selected-true { background: #1a5e44; color: white; border-color: #1a5e44; }
        .opt-btn.selected-false { background: #1a5e44; color: white; border-color: #1a5e44; }
        .opt-btn.correct-show { background: #28a745; color: white; border-color: #28a745; }
        .opt-btn.wrong-show { background: #dc3545; color: white; border-color: #dc3545; }
        .feedback { margin-top: 20px; padding: 15px; border-radius: 20px; font-size: 0.95rem; line-height: 1.4; }
        .feedback.correct { background: #d4edda; border-left: 6px solid #28a745; }
        .feedback.wrong { background: #f8d7da; border-left: 6px solid #dc3545; }
        .hidden { display: none; }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin: 20px 0 10px; padding-top: 15px; border-top: 1px solid #dde5e0; }
        .tool-btn { background: #ecf3ef; border: 1px solid #b3cdbf; padding: 10px 18px; font-size: 1rem; font-weight: 600; border-radius: 48px; cursor: pointer; transition: 0.1s; font-family: inherit; }
        .tool-btn:hover { background: #dce8e0; }
        .tool-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .result-screen { text-align: center; }
        .result-box { background: #f0f7f3; padding: 25px; border-radius: 28px; margin: 20px 0; }
        .restart-btn { background: #1a5e44; color: white; border: none; padding: 16px 24px; border-radius: 60px; width: 100%; cursor: pointer; margin-top: 10px; font-size: 1.2rem; font-weight: bold; }
        .stats { font-size: 1.1rem; line-height: 1.8; }
        hr { margin: 15px 0; border-color: #c0d9ce; }
        @media (max-width: 640px) { .quiz-wrapper { max-width: 100%; padding: 15px; } .opt-btn { padding: 10px 20px; min-width: 120px; font-size: 1rem; } .toolbar { gap: 8px; } .tool-btn { padding: 8px 14px; font-size: 0.85rem; } .question-text { font-size: 1rem; padding: 15px; } }
    </style>
</head>
<body>
<div class="quiz-wrapper">
    <div id="introScreen" class="screen active intro-card">
        <h1>🇧🇷 Brasil República</h1>
        <div class="revisao">Quiz · Bloco 4 · 31 questões</div>
        <div class="professora">Professora Angela Siqueira</div>
        <button class="btn-iniciar" id="startQuizBtn">▶ Iniciar Quiz</button>
    </div>

    <div id="quizScreen" class="screen">
        <div class="title">🎯 Verdadeiro ou Falso?</div>
        <div class="sub">Proclamação · Primeira República · Vargas · Golpe 1964 · Nacionalismo · Regime militar · Nova República · Constituição 1988 · Atualidades</div>
        <div class="progress-row">
            <span id="progressText">Questão 1 de 31</span>
            <span id="scoreDisplay">✅ 0 acertos</span>
        </div>
        <div class="progress-bar-bg"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>
        <div id="questionArea">
            <div id="questionText" class="question-text"></div>
            <div class="options" id="optionsArea">
                <button class="opt-btn" id="trueBtn">✅ VERDADEIRO</button>
                <button class="opt-btn" id="falseBtn">❌ FALSO</button>
            </div>
            <div id="feedbackArea" class="feedback hidden"></div>
        </div>
        <div class="toolbar">
            <button class="tool-btn" id="fontMinusBtn">A−</button>
            <button class="tool-btn" id="fontPlusBtn">A+</button>
            <button class="tool-btn" id="fullscreenBtn">⛶ Tela cheia</button>
            <button class="tool-btn" id="prevBtn" disabled>◀ Anterior</button>
            <button class="tool-btn" id="nextBtn" disabled>Próxima ▶</button>
        </div>
    </div>

    <div id="resultScreen" class="screen result-screen">
        <h2>📊 Estatística da sua pontuação</h2>
        <div class="result-box" id="resultContent"></div>
        <button class="restart-btn" id="restartQuizBtn">🔄 Refazer quiz</button>
    </div>
</div>

<script>
    const questions = [
        { text: "A Proclamação da República (1889) foi um movimento amplamente apoiado pela população, que participou ativamente das ruas.", answer: false, justification: "Segundo o jornalista Aristides Lobo, o povo 'assistiu àquilo bestializado', sem participação popular significativa." },
        { text: "A Primeira República (1889–1930) foi marcada pelo domínio das oligarquias e pela política do café-com-leite.", answer: true, justification: "O poder era controlado por São Paulo (café) e Minas Gerais (leite), com eleições manipuladas (voto de cabresto)." },
        { text: "A Revolução de 1930 colocou Getúlio Vargas no poder, encerrando a Primeira República.", answer: true, justification: "A insatisfação com a crise de 1929 e o domínio oligárquico levaram à Revolução de 1930, que levou Vargas ao poder." },
        { text: "O Estado Novo (1937–1945) foi um período democrático com ampla participação popular.", answer: false, justification: "O Estado Novo foi uma ditadura, com repressão, censura e concentração de poder em Vargas." },
        { text: "A CLT (Consolidação das Leis do Trabalho) foi criada em 1943, durante o Estado Novo, reunindo a legislação trabalhista.", answer: true, justification: "A CLT foi um marco dos direitos trabalhistas, mas foi concedida em um contexto autoritário." },
        { text: "O suicídio de Getúlio Vargas, em 1954, ocorreu durante seu segundo governo, em meio a um processo de impeachment.", answer: true, justification: "Vargas suicidou-se em agosto de 1954, pressionado pela oposição e pela imprensa, em meio a uma crise política." },
        { text: "O governo de Juscelino Kubitschek (1956–1961) foi marcado pelo Plano de Metas e pela construção de Brasília.", answer: true, justification: "JK promoveu o desenvolvimentismo, com investimentos em indústria, energia e transportes, e a nova capital." },
        { text: "Jânio Quadros renunciou à presidência em 1961 e foi sucedido por João Goulart, que assumiu com plenos poderes imediatamente.", answer: false, justification: "Jango assumiu com poderes limitados (parlamentarismo) até 1963, quando o presidencialismo foi restabelecido por plebiscito." },
        { text: "As reformas de base propostas por João Goulart incluíam reforma agrária e reforma urbana, entre outras.", answer: true, justification: "As reformas de base visavam reduzir desigualdades, mas enfrentaram forte oposição, contribuindo para o golpe de 1964." },
        { text: "O golpe de 1964 instaurou um regime civil-militar que durou 21 anos, com repressão e censura.", answer: true, justification: "O regime militar (1964–1985) foi marcado por repressão política, censura e concentração do poder." },
        { text: "O AI-5 (1968) foi um ato institucional que fechou o Congresso e suspendeu direitos políticos, intensificando a repressão.", answer: true, justification: "O AI-5 foi o mais repressivo dos Atos Institucionais, permitindo prisões sem julgamento e censura." },
        { text: "O 'milagre econômico' (1968–1973) foi um período de crescimento acelerado, mas com aumento da dívida externa e concentração de renda.", answer: true, justification: "O crescimento de mais de 10% ao ano foi acompanhado de desigualdade e endividamento." },
        { text: "A Lei da Anistia (1979) perdoou crimes políticos cometidos por ambos os lados, mas sem punir militares por torturas e assassinatos.", answer: true, justification: "A anistia foi ampla, permitindo o retorno de exilados, mas também isentando os agentes da repressão." },
        { text: "A campanha 'Diretas Já' (1984) foi um movimento popular que conseguiu aprovar a emenda para eleições diretas para presidente.", answer: false, justification: "A emenda Dante de Oliveira foi rejeitada, e a redemocratização se deu por eleição indireta em 1985." },
        { text: "A Constituição de 1988 é chamada de 'Constituição Cidadã' por garantir amplos direitos civis, políticos, sociais e coletivos.", answer: true, justification: "A Constituição de 1988 consolidou a democracia e universalizou direitos como saúde, educação e moradia." },
        { text: "O Plano Real (1994) foi um plano de estabilização econômica que conseguiu controlar a hiperinflação no Brasil.", answer: true, justification: "O Plano Real, com a criação do Real, reduziu drasticamente a inflação e estabilizou a economia." },
        { text: "As privatizações no governo FHC (1995–2002) incluíram a venda da Vale do Rio Doce e do sistema Telebrás.", answer: true, justification: "O programa de privatizações transferiu empresas estatais para o setor privado, sob a justificativa de modernização." },
        { text: "O impeachment de Dilma Rousseff (2016) foi o primeiro na história do Brasil, sendo motivado por acusações de corrupção.", answer: false, justification: "O impeachment de Dilma foi por 'pedaladas fiscais' (crime de responsabilidade), não por corrupção. O primeiro impeachment foi de Collor, em 1992." },
        { text: "A Lei Maria da Penha (2006) é uma lei que visa proteger as mulheres da violência doméstica e familiar.", answer: true, justification: "A lei é um marco no combate à violência contra a mulher, embora os desafios persistam." },
        { text: "A população negra no Brasil sofre com o racismo estrutural e com menores indicadores de educação, saúde e renda.", answer: true, justification: "O racismo estrutural é um legado da escravidão, afetando a população negra até os dias atuais." },
        { text: "A Guerra do Paraguai (1864–1870) fortaleceu o Exército brasileiro e aumentou a dívida do império.", answer: true, justification: "O conflito deixou o Exército fortalecido politicamente, mas também endividou o Brasil." },
        { text: "O golpe da maioridade (1840) antecipou a maioridade de dom Pedro II para que ele pudesse governar aos 15 anos.", answer: true, justification: "Os liberais promoveram o golpe para que Pedro II assumisse o trono antes dos 18 anos." },
        { text: "A Lei de Terras (1850) facilitou o acesso à terra para pequenos agricultores e libertos.", answer: false, justification: "A lei dificultou o acesso, pois exigia compra, excluindo posseiros e libertos." },
        { text: "A Revolução Farroupilha (1835–1845) proclamou a República Rio-Grandense e contou com a participação de Garibaldi.", answer: true, justification: "Os farrapos proclamaram a República Rio-Grandense em 1836, com apoio de Giuseppe Garibaldi e Anita." },
        { text: "A Lei Eusébio de Queirós (1850) aboliu a escravidão no Brasil.", answer: false, justification: "A lei proibiu o tráfico transatlântico de escravos, não a escravidão, que só foi abolida em 1888." },
        { text: "A Confederação do Equador (1824) foi um movimento republicano e federalista contra o autoritarismo de dom Pedro I.", answer: true, justification: "O movimento contestava a centralização monárquica e defendia a república." },
        { text: "O Poder Moderador, criado pela Constituição de 1824, permitia ao imperador dissolver a Câmara e vetar leis.", answer: true, justification: "Esse poder dava amplos poderes ao imperador sobre os demais poderes." },
        { text: "A Revolta dos Malês (1835), em Salvador, foi um levante de escravizados e libertos que seguiam a fé islâmica.", answer: true, justification: "Os malês eram africanos islamizados que lideraram uma revolta contra a escravidão." },
        { text: "O Instituto Histórico e Geográfico Brasileiro (IHGB) promoveu a valorização da cultura africana na identidade nacional.", answer: false, justification: "O IHGB idealizou o indígena e apagou a importância dos africanos na formação do Brasil." },
        { text: "A fotografia chegou ao Brasil em 1840 e foi incentivada por dom Pedro II.", answer: true, justification: "O imperador era entusiasta da fotografia, promovendo sua difusão." },
        { text: "A crise de 1929 impactou duramente o Brasil, especialmente o setor cafeeiro, contribuindo para o fim da Primeira República.", answer: true, justification: "A queda do preço do café e a falta de crédito agravaram a crise econômica e política." }
    ];

    const total = questions.length;
    let currentIndex = 0;
    let userAnswers = new Array(total).fill(null);
    let quizFontSize = 16;

    const introScreen = document.getElementById('introScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const startQuizBtn = document.getElementById('startQuizBtn');
    const restartQuizBtn = document.getElementById('restartQuizBtn');
    const questionText = document.getElementById('questionText');
    const feedbackArea = document.getElementById('feedbackArea');
    const trueBtn = document.getElementById('trueBtn');
    const falseBtn = document.getElementById('falseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressText = document.getElementById('progressText');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const progressFill = document.getElementById('progressFill');
    const resultContent = document.getElementById('resultContent');
    const fontMinusBtn = document.getElementById('fontMinusBtn');
    const fontPlusBtn = document.getElementById('fontPlusBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    function updateScoreDisplay() {
        let correct = 0;
        for (let i = 0; i < total; i++) if (userAnswers[i] !== null && userAnswers[i] === questions[i].answer) correct++;
        scoreDisplay.textContent = `✅ ${correct} acertos`;
    }

    function applyFontSize() { document.querySelector('.quiz-wrapper').style.fontSize = quizFontSize + 'px'; }
    fontMinusBtn.addEventListener('click', () => { if (quizFontSize > 12) { quizFontSize -= 2; applyFontSize(); } });
    fontPlusBtn.addEventListener('click', () => { if (quizFontSize < 36) { quizFontSize += 2; applyFontSize(); } });
    fullscreenBtn.addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); });

    function resetStyles() {
        trueBtn.classList.remove('selected-true', 'correct-show', 'wrong-show');
        falseBtn.classList.remove('selected-false', 'correct-show', 'wrong-show');
    }

    function renderQuestion() {
        const q = questions[currentIndex];
        questionText.innerText = q.text;
        feedbackArea.classList.add('hidden');
        feedbackArea.className = 'feedback hidden';
        resetStyles();
        const val = userAnswers[currentIndex];
        if (val !== null) {
            if (val === true) trueBtn.classList.add('selected-true');
            else falseBtn.classList.add('selected-false');
            showFeedback(val);
        }
        progressText.innerText = `Questão ${currentIndex+1} de ${total}`;
        progressFill.style.width = ((currentIndex+1)/total*100) + '%';
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = false;
        updateScoreDisplay();
    }

    function showFeedback(val) {
        const q = questions[currentIndex];
        const isCorrect = (val === q.answer);
        resetStyles();
        if (q.answer === true) trueBtn.classList.add('correct-show');
        else falseBtn.classList.add('correct-show');
        if (!isCorrect) {
            if (val === true) trueBtn.classList.add('wrong-show');
            else falseBtn.classList.add('wrong-show');
        }
        const resp = q.answer ? "VERDADEIRO" : "FALSO";
        feedbackArea.classList.remove('hidden', 'correct', 'wrong');
        feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
        feedbackArea.innerHTML = `<strong>${isCorrect ? '✓ Correto!' : '✗ Incorreto'}</strong><br>${q.justification}<br><span style="font-size:0.9rem;">Resposta correta: <strong>${resp}</strong></span>`;
    }

    function selectAnswer(value) {
        if (userAnswers[currentIndex] !== null) return;
        userAnswers[currentIndex] = value;
        if (value === true) trueBtn.classList.add('selected-true');
        else falseBtn.classList.add('selected-false');
        showFeedback(value);
        updateScoreDisplay();
    }

    trueBtn.addEventListener('click', () => { if (userAnswers[currentIndex] === null) selectAnswer(true); });
    falseBtn.addEventListener('click', () => { if (userAnswers[currentIndex] === null) selectAnswer(false); });

    prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(); } });
    nextBtn.addEventListener('click', () => {
        if (userAnswers[currentIndex] === null) { alert('⚠️ Responda a questão antes de avançar.'); return; }
        if (currentIndex < total - 1) { currentIndex++; renderQuestion(); }
        else mostrarResultado();
    });

    function mostrarResultado() {
        let acertos = 0;
        for (let i = 0; i < total; i++) if (userAnswers[i] === questions[i].answer) acertos++;
        const percentual = (acertos / total) * 100;
        const nota = (acertos / total) * 10;
        let mensagem = percentual >= 85 ? "⭐ Excelente! Você domina a República brasileira." :
                       percentual >= 70 ? "👍 Muito bom! Reveja os tópicos que errou." :
                       percentual >= 50 ? "📘 Bom, mas pode melhorar." : "📚 Releia o conteúdo e tente novamente.";
        resultContent.innerHTML = `
            <div class="stats">
                <p><strong>✅ Acertos:</strong> ${acertos} de ${total}</p>
                <p><strong>❌ Erros:</strong> ${total - acertos} de ${total}</p>
                <p><strong>📊 Percentual de acerto:</strong> ${percentual.toFixed(1)}%</p>
                <p><strong>🎓 Nota (0 a 10):</strong> ${nota.toFixed(1)}</p>
                <hr>
                <p>${mensagem}</p>
            </div>
        `;
        quizScreen.classList.remove('active');
        resultScreen.classList.add('active');
    }

    function reiniciar() {
        userAnswers = new Array(total).fill(null);
        currentIndex = 0;
        resultScreen.classList.remove('active');
        introScreen.classList.add('active');
    }
    restartQuizBtn.addEventListener('click', reiniciar);
    startQuizBtn.addEventListener('click', () => {
        introScreen.classList.remove('active');
        quizScreen.classList.add('active');
        renderQuestion();
    });
    applyFontSize();
</script>
</body>
</html>
