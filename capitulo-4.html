<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>🌿 Os primeiros habitantes · Brasil</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Verdana', 'Arial', sans-serif;
            background: #f5f7f6;
            color: #1a2e2a;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            margin: 0;
        }

        .reader-wrapper {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            padding: 12px 18px;
            border: 1px solid #dde5e0;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        .fixed-header {
            margin-bottom: 10px;
            border-bottom: 2px solid #dde5e0;
            padding-bottom: 6px;
        }
        .fixed-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f3d2e;
            line-height: 1.2;
            margin-bottom: 4px;
        }
        .progress-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1a5e44;
            margin-bottom: 4px;
        }
        .progress-bar-bg {
            background: #dee6e1;
            height: 6px;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            background: #1a7a58;
            height: 6px;
            width: 0%;
            border-radius: 20px;
            transition: width 0.2s;
        }

        .text-content {
            text-align: justify;
            padding: 6px 0 12px;
            max-height: 75vh;
            overflow-y: auto;
            font-size: 18px;
            line-height: 1.8;
            margin: 0 2px;
            scroll-behavior: smooth;
        }
        .text-content p { margin-bottom: 0.8em; }
        .text-content h2, .text-content h3, .text-content h4 {
            margin: 1em 0 0.3em;
            color: #154e3a;
            font-weight: 600;
        }
        .text-content ul, .text-content ol {
            padding-left: 1.8em;
            margin: 0.4em 0;
        }
        .text-content li {
            margin-bottom: 0.3em;
        }

        .speech-word {
            transition: background-color 0.15s ease, color 0.15s ease;
            border-radius: 3px;
            padding: 1px 2px;
            margin: 0 1px;
        }
        .speech-word.active {
            background-color: #ffeb3b;
            color: #000;
            font-weight: 600;
        }
        .speech-word.upcoming {
            background-color: #fff9c4;
        }

        .img-text-row {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .img-container {
            flex: 1;
            min-width: 140px;
            text-align: center;
        }
        .img-container img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .img-caption {
            font-size: 0.8rem;
            color: #5a7a6a;
            margin-top: 6px;
            font-style: italic;
        }
        .text-container {
            flex: 2;
            min-width: 180px;
        }
        .right-image .text-container { order: 1; }
        .right-image .img-container { order: 2; }
        .left-image .text-container { order: 2; }
        .left-image .img-container { order: 1; }

        .toolbar-single {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 5px;
            margin: 14px 0 10px;
            padding: 4px 0 6px;
            border-top: 1px solid #dde5e0;
            border-bottom: 1px solid #dde5e0;
        }
        .tool-btn {
            background: #ecf3ef;
            border: 1px solid #b3cdbf;
            color: #134531;
            font-weight: 600;
            font-size: 1rem;
            padding: 8px 12px;
            border-radius: 48px;
            min-width: 50px;
            text-align: center;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tool-btn:active { background: #d0e0d7; transform: scale(0.96); }
        .tool-btn:disabled { opacity: 0.4; background: #e0e8e3; border-color: #b6ccc1; pointer-events: none; }
        .tool-btn.hidden { display: none; }

        .capa {
            text-align: center;
            padding: 30px 20px;
        }
        .capa h1 { font-size: 32px; margin-bottom: 16px; color: #0f3d2e; }
        .capa h2 { font-size: 26px; margin-bottom: 30px; color: #1a5e44; }
        .capa p { font-size: 20px; color: #2a5e4a; }

        .congrats-page {
            text-align: center;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 40vh;
        }
        .congrats-page h2 { color: #1a5e44; margin-bottom: 10px; font-size: 1.8rem; }
        .congrats-image { text-align: center; margin: 15px auto; }
        .congrats-image img {
            transform: scale(1.2);
            max-width: 100%;
            border-radius: 12px;
        }

        @media (max-width: 700px) {
            .reader-wrapper {
                padding: 8px 10px;
                border-radius: 16px;
            }
            .tool-btn { padding: 6px 8px; min-width: 44px; font-size: 0.85rem; }
            .img-text-row { flex-direction: column; gap: 10px; }
            .right-image .text-container, .right-image .img-container,
            .left-image .text-container, .left-image .img-container { order: unset; }
            .text-content {
                max-height: 70vh;
                font-size: 16px;
            }
            .fixed-header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="reader-wrapper">
    <div id="readerScreen" class="screen active">
        <div class="fixed-header">
            <h1>🌿 Os primeiros habitantes · Diversidade e origens</h1>
            <div class="progress-row">
                <span id="pageXofY">Página 1 de 6</span>
                <span id="progressPercent">16%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>
        <div class="text-content" id="pageContent"></div>
        <div class="toolbar-single">
            <button class="tool-btn" id="fontMinusBtn" title="Diminuir fonte">A−</button>
            <button class="tool-btn" id="fontPlusBtn" title="Aumentar fonte">A+</button>
            <button class="tool-btn" id="fullscreenBtn" title="Tela cheia">⛶</button>
            <button class="tool-btn" id="prevBtnInline" title="Página anterior">◀</button>
            <button class="tool-btn" id="nextBtnInline" title="Próxima página">▶</button>
            <button class="tool-btn" id="speakBtn" title="Ouvir">🔊</button>
            <button class="tool-btn hidden" id="pauseBtn" title="Pausar">⏸️</button>
            <button class="tool-btn hidden" id="resumeBtn" title="Retomar">▶️</button>
            <button class="tool-btn hidden" id="stopBtn" title="Parar">⏹️</button>
            <select id="rateSelect" class="tool-btn" style="width: auto; background: #ecf3ef; border: 1px solid #b3cdbf; padding: 8px 12px;">
                <option value="0.75">0.75x</option>
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>
            </select>
        </div>
    </div>
</div>

<script>
    (function(){
        // ============ CONTEÚDO DAS PÁGINAS ============
        const pageContents = [
            // Página 0 - Capa
            `<div class="capa">
                <h1>Os primeiros habitantes</h1>
                <h2>Diversidade cultural e narrativas de origem dos povos indígenas</h2>
                <p>Professora Angela Siqueira</p>
            </div>`,
            // Página 1 - Índice
            `<div class="text-container" style="max-width:100%;">
                <h3>📌 Roteiro</h3>
                <ol>
                    <li>Capa – Pág. 1</li>
                    <li>Os primeiros habitantes – Pág. 3</li>
                    <li>Diversidade cultural – Pág. 4</li>
                    <li>Narrativas de origem – Pág. 5</li>
                    <li>Fechamento – Pág. 6</li>
                </ol>
            </div>`,
            // Página 2 - Os primeiros habitantes (contexto geral)
            `<div class="img-text-row left-image">
                <div class="img-container">
                    <img src="https://i.imgur.com/OFebAbU.png" alt="Mapa com distribuição dos povos indígenas no Brasil">
                    <div class="img-caption">Distribuição dos povos indígenas no Brasil (século XVI)</div>
                </div>
                <div class="text-container">
                    <p><strong>Os primeiros habitantes</strong></p>
                    <p>Antes da chegada dos portugueses, o território brasileiro era ocupado por centenas de povos indígenas, com culturas, línguas e modos de vida diversos. Estima-se que, em 1500, viviam aqui entre 2 e 5 milhões de indígenas, organizados em tribos, aldeias e grandes grupos linguísticos (tupi-guarani, macro-jê, aruaque, entre outros).</p>
                    <p>Essas sociedades desenvolveram complexos sistemas de agricultura (como a mandioca), caça, pesca, artesanato, medicina tradicional e rituais religiosos. A colonização europeia, no entanto, provocou um genocídio e etnocídio que reduziu drasticamente essa população.</p>
                </div>
            </div>`,
            // Página 3 - Diversidade cultural
            `<div class="img-text-row right-image">
                <div class="text-container">
                    <h3>Diversidade cultural</h3>
                    <ul>
                        <li><strong>Línguas:</strong> mais de 150 línguas indígenas ainda são faladas no Brasil, pertencentes a cerca de 40 famílias linguísticas.</li>
                        <li><strong>Cosmologias:</strong> cada povo possui sua própria visão de mundo, mitos de criação, seres encantados e relação com a natureza.</li>
                        <li><strong>Artesanato:</strong> cerâmica, cestaria, plumária, pintura corporal e tecelagem variam conforme a região e o grupo étnico.</li>
                        <li><strong>Organização social:</strong> sistemas de parentesco, liderança (caciques, pajés) e divisão de tarefas são singulares a cada povo.</li>
                        <li><strong>Rituais:</strong> festas, danças, cantos e cerimônias de passagem marcam a vida comunitária.</li>
                    </ul>
                    <p>Exemplos notáveis: os <strong>Yanomami</strong> (Amazônia), <strong>Xavante</strong> (Mato Grosso), <strong>Kaingang</strong> (Sul), <strong>Pataxó</strong> (Bahia) e <strong>Tupi-Guarani</strong> (litoral).</p>
                </div>
                <div class="img-container">
                    <img src="https://i.imgur.com/4HysPnB.png" alt="Índios Kayapó com pintura corporal e cocares">
                    <div class="img-caption">Índios Kayapó – exemplo da diversidade cultural</div>
                </div>
            </div>`,
            // Página 4 - Narrativas de origem
            `<div class="img-text-row left-image">
                <div class="img-container">
                    <img src="https://i.imgur.com/vQk1fUE.png" alt="Ilustração de mito indígena">
                    <div class="img-caption">Representação de mito guarani (Tupã e a criação)</div>
                </div>
                <div class="text-container">
                    <h3>Narrativas de origem</h3>
                    <p>Cada povo indígena possui suas próprias histórias sobre a origem do mundo, dos seres humanos, dos animais e das plantas. Essas narrativas são transmitidas oralmente e carregam ensinamentos sobre valores, ética e relação com a natureza.</p>
                    <ul>
                        <li><strong>Mito Tupi-Guarani:</strong> Tupã, o deus do trovão, criou o mundo e os humanos. A lenda de <em>Guaraci</em> (o Sol) e <em>Jaci</em> (a Lua) explica a sucessão do dia e da noite.</li>
                        <li><strong>Mito dos Kayapó:</strong> a origem do fogo e da agricultura está ligada a heróis culturais que ensinaram os homens a plantar.</li>
                        <li><strong>Mito dos Yanomami:</strong> a criação do céu e da terra, e a importância das árvores frutíferas.</li>
                        <li><strong>Lenda do Uirapuru:</strong> conta a história de um guerreiro que se transformou em pássaro – símbolo de amor e sabedoria.</li>
                    </ul>
                </div>
            </div>`,
            // Página 5 - Fechamento (parabéns)
            `<div class="congrats-page">
                <h2>🌱 Parabéns!</h2>
                <p style="margin-top: 20px;">Você conheceu um pouco sobre os primeiros habitantes do Brasil.</p>
                <div class="congrats-image">
                    <img src="https://media.tenor.com/1Gq9HnEJ5wMAAAAM/shih-tzu-shihtzu.gif" alt="Parabéns">
                </div>
                <p style="margin-top: 20px;">Respeito à diversidade e valorização das culturas indígenas!</p>
            </div>`
        ];

        const totalPages = pageContents.length;
        let currentPage = 0;
        let fontSizeIndex = 4;
        const fontSizes = [12, 14, 16, 18, 20, 24, 28, 32, 38, 42];

        // Elementos DOM
        const pageContent = document.getElementById('pageContent');
        const pageXofY = document.getElementById('pageXofY');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const fontMinus = document.getElementById('fontMinusBtn');
        const fontPlus = document.getElementById('fontPlusBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const prevBtn = document.getElementById('prevBtnInline');
        const nextBtn = document.getElementById('nextBtnInline');
        const speakBtn = document.getElementById('speakBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const stopBtn = document.getElementById('stopBtn');
        const rateSelect = document.getElementById('rateSelect');

        let synth = window.speechSynthesis;
        let currentUtterance = null;
        let isSpeaking = false;
        let isPaused = false;
        let speechToken = null;
        let previousActiveSpan = null;

        let wordSpans = [];
        let charIndexToSpanMap = [];
        let currentCharIndex = 0;

        function getFemaleVoice() {
            const voices = synth.getVoices();
            const ptVoices = voices.filter(v => v.lang === 'pt-BR');
            const female = ptVoices.find(v =>
                v.name.toLowerCase().includes('female') ||
                v.name.toLowerCase().includes('mulher') ||
                v.name.includes('Samantha') ||
                v.name.includes('Maria')
            );
            return female || ptVoices[0] || voices[0];
        }

        function tokenizeTextNodes(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            while (walker.nextNode()) {
                textNodes.push(walker.currentNode);
            }
            textNodes.forEach(node => {
                const text = node.textContent;
                if (!text.trim()) return;
                const fragment = document.createDocumentFragment();
                const parts = text.split(/(\s+)/);
                parts.forEach(part => {
                    if (part.trim()) {
                        const span = document.createElement('span');
                        span.className = 'speech-word';
                        span.textContent = part;
                        fragment.appendChild(span);
                    } else {
                        fragment.appendChild(document.createTextNode(part));
                    }
                });
                node.parentNode.replaceChild(fragment, node);
            });
        }

        function buildCharMap() {
            wordSpans = Array.from(pageContent.querySelectorAll('.speech-word'));
            charIndexToSpanMap = [];
            wordSpans.forEach((span, idx) => {
                const len = span.textContent.length;
                for (let i = 0; i < len; i++) {
                    charIndexToSpanMap.push(idx);
                }
                if (idx < wordSpans.length - 1) {
                    charIndexToSpanMap.push(idx);
                }
            });
        }

        function highlightWordSpan(spanIndex) {
            if (previousActiveSpan !== null && previousActiveSpan !== undefined) {
                const prevSpan = wordSpans[previousActiveSpan];
                if (prevSpan) {
                    prevSpan.classList.remove('active');
                    prevSpan.classList.remove('upcoming');
                }
            }
            if (spanIndex >= 0 && spanIndex < wordSpans.length) {
                const currentSpan = wordSpans[spanIndex];
                currentSpan.classList.add('active');
                currentSpan.classList.remove('upcoming');
                previousActiveSpan = spanIndex;
                currentSpan.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function markUpcoming(spanIndex) {
            wordSpans.forEach(s => s.classList.remove('upcoming'));
            for (let i = 1; i <= 3; i++) {
                const nextIdx = spanIndex + i;
                if (nextIdx < wordSpans.length) {
                    wordSpans[nextIdx].classList.add('upcoming');
                }
            }
        }

        function clearAllWordHighlights() {
            wordSpans.forEach(s => {
                s.classList.remove('active');
                s.classList.remove('upcoming');
            });
            previousActiveSpan = null;
        }

        function syncHighlightFromCharIndex() {
            if (currentCharIndex >= charIndexToSpanMap.length) return;
            const spanIdx = charIndexToSpanMap[currentCharIndex];
            if (spanIdx !== undefined && spanIdx !== previousActiveSpan) {
                highlightWordSpan(spanIdx);
                markUpcoming(spanIdx);
            }
        }

        function showPlayingUI() {
            speakBtn.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
            stopBtn.classList.remove('hidden');
            resumeBtn.classList.add('hidden');
        }

        function showPausedUI() {
            pauseBtn.classList.add('hidden');
            stopBtn.classList.add('hidden');
            resumeBtn.classList.remove('hidden');
            speakBtn.classList.add('hidden');
        }

        function showStoppedUI() {
            speakBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            resumeBtn.classList.add('hidden');
            stopBtn.classList.add('hidden');
        }

        function startReading() {
            if (!synth) {
                alert('Seu navegador não suporta síntese de voz.');
                return;
            }

            if (isPaused) {
                synth.resume();
                isPaused = false;
                isSpeaking = true;
                showPlayingUI();
                return;
            }

            if (isSpeaking) {
                stopReading();
                return;
            }

            if (pageContent.querySelectorAll('.speech-word').length === 0) {
                tokenizeTextNodes(pageContent);
            }
            buildCharMap();

            if (wordSpans.length === 0) return;

            const text = wordSpans.map(s => s.textContent).join(' ');

            currentUtterance = new SpeechSynthesisUtterance(text);
            const voice = getFemaleVoice();
            if (voice) currentUtterance.voice = voice;
            currentUtterance.rate = parseFloat(rateSelect.value);

            const token = Date.now();
            speechToken = token;
            currentCharIndex = 0;

            currentUtterance.onboundary = function(event) {
                if (speechToken !== token) return;
                if (event.name === 'word') {
                    currentCharIndex = event.charIndex;
                    syncHighlightFromCharIndex();
                }
            };

            currentUtterance.onstart = function() {
                if (speechToken !== token) return;
                isSpeaking = true;
                isPaused = false;
                showPlayingUI();
            };

            currentUtterance.onend = function() {
                if (speechToken !== token) return;
                resetSpeechState();
            };

            currentUtterance.onerror = function(e) {
                if (speechToken !== token) return;
                if (e.error !== 'canceled' && e.error !== 'interrupted') {
                    console.warn('Speech error:', e.error);
                }
                resetSpeechState();
            };

            synth.speak(currentUtterance);
        }

        function pauseReading() {
            if (synth && isSpeaking && !isPaused) {
                synth.pause();
                isPaused = true;
                showPausedUI();
            }
        }

        function resumeReading() {
            if (synth && isPaused) {
                synth.resume();
                isPaused = false;
                isSpeaking = true;
                showPlayingUI();
            }
        }

        function stopReading() {
            if (synth) {
                synth.cancel();
            }
            resetSpeechState();
        }

        function resetSpeechState() {
            if (synth && synth.speaking) {
                synth.cancel();
            }
            if (currentUtterance) {
                currentUtterance.onboundary = null;
                currentUtterance.onstart = null;
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance = null;
            }
            isSpeaking = false;
            isPaused = false;
            speechToken = null;
            currentCharIndex = 0;
            clearAllWordHighlights();
            showStoppedUI();
        }

        function updateUI() {
            resetSpeechState();
            pageContent.innerHTML = pageContents[currentPage];
            const num = currentPage + 1;
            pageXofY.textContent = `Página ${num} de ${totalPages}`;
            const pct = (num / totalPages) * 100;
            progressFill.style.width = pct + '%';
            progressPercent.textContent = Math.round(pct) + '%';
            prevBtn.disabled = (currentPage === 0);
            nextBtn.disabled = (currentPage === totalPages - 1);
            if (pageContent.scrollTop) pageContent.scrollTop = 0;
        }

        function applyFontSize() {
            const size = fontSizes[fontSizeIndex] + 'px';
            pageContent.style.fontSize = size;
            fontMinus.disabled = (fontSizeIndex === 0);
            fontPlus.disabled = (fontSizeIndex === fontSizes.length - 1);
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                updateUI();
            }
        }

        // Event listeners
        fontMinus.addEventListener('click', () => {
            if (fontSizeIndex > 0) fontSizeIndex--;
            applyFontSize();
        });
        fontPlus.addEventListener('click', () => {
            if (fontSizeIndex < fontSizes.length - 1) fontSizeIndex++;
            applyFontSize();
        });
        fullscreenBtn.addEventListener('click', () => {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen();
            }
        });
        prevBtn.addEventListener('click', () => changePage(-1));
        nextBtn.addEventListener('click', () => changePage(1));

        speakBtn.addEventListener('click', startReading);
        pauseBtn.addEventListener('click', pauseReading);
        resumeBtn.addEventListener('click', resumeReading);
        stopBtn.addEventListener('click', stopReading);

        rateSelect.addEventListener('change', () => {
            if (currentUtterance && isSpeaking && !isPaused) {
                currentUtterance.rate = parseFloat(rateSelect.value);
            }
        });

        // Inicialização
        applyFontSize();
        updateUI();
        if (synth) synth.getVoices();
    })();
</script>
</body>
</html>
