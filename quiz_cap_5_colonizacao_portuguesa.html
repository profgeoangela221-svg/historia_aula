<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Quiz · Bloco 3 · Conquista e Colonização</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Verdana', 'Arial', sans-serif; background: #f5f7f6; color: #1a2e2a; line-height: 1.4; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 12px; }
        .quiz-wrapper { width: 100%; max-width: 85%; margin: 0 auto; background: white; border-radius: 28px; box-shadow: 0 12px 28px rgba(0,0,0,0.04); padding: 20px 30px; border: 1px solid #dde5e0; }
        .screen { display: none; } .screen.active { display: block; }
        .intro-card { text-align: center; }
        .intro-card h1 { font-size: 2.2rem; font-weight: 700; color: #0f3d2e; margin-bottom: 20px; }
        .intro-card .revisao { font-size: 1.4rem; color: #2a5e4a; margin-bottom: 12px; font-weight: 600; }
        .intro-card .professora { font-size: 1.2rem; color: #1a5e44; margin-bottom: 40px; font-style: italic; }
        .intro-card .btn-iniciar { background: #1a5e44; color: white; border: none; padding: 18px 40px; font-size: 1.4rem; font-weight: bold; border-radius: 60px; cursor: pointer; margin-top: 20px; transition: transform 0.2s; }
        .intro-card .btn-iniciar:hover { background: #0f4a35; transform: scale(1.02); }
        .title { font-size: 1.7rem; font-weight: 700; color: #0f3d2e; margin-bottom: 8px; text-align: center; }
        .sub { text-align: center; color: #2a5e4a; margin-bottom: 20px; font-style: italic; }
        .progress-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.9rem; font-weight: 600; color: #1a5e44; margin-bottom: 8px; }
        .progress-bar-bg { background: #dee6e1; height: 8px; border-radius: 20px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { background: #1a7a58; height: 8px; width: 0%; border-radius: 20px; transition: width 0.2s; }
        .question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 25px; line-height: 1.5; text-align: center; background: #f0f7f3; padding: 20px; border-radius: 20px; }
        .options { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
        .opt-btn { background: #ecf3ef; border: 2px solid #b3cdbf; padding: 14px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 60px; cursor: pointer; transition: 0.1s; text-align: center; min-width: 150px; font-family: inherit; }
        .opt-btn:hover { background: #dce8e0; transform: scale(1.02); }
        .opt-btn.selected-true { background: #1a5e44; color: white; border-color: #1a5e44; }
        .opt-btn.selected-false { background: #1a5e44; color: white; border-color: #1a5e44; }
        .opt-btn.correct-show { background: #28a745; color: white; border-color: #28a745; }
        .opt-btn.wrong-show { background: #dc3545; color: white; border-color: #dc3545; }
        .feedback { margin-top: 20px; padding: 15px; border-radius: 20px; font-size: 0.95rem; line-height: 1.4; }
        .feedback.correct { background: #d4edda; border-left: 6px solid #28a745; }
        .feedback.wrong { background: #f8d7da; border-left: 6px solid #dc3545; }
        .hidden { display: none; }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin: 20px 0 10px; padding-top: 15px; border-top: 1px solid #dde5e0; }
        .tool-btn { background: #ecf3ef; border: 1px solid #b3cdbf; padding: 10px 18px; font-size: 1rem; font-weight: 600; border-radius: 48px; cursor: pointer; transition: 0.1s; font-family: inherit; }
        .tool-btn:hover { background: #dce8e0; }
        .tool-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .result-screen { text-align: center; }
        .result-box { background: #f0f7f3; padding: 25px; border-radius: 28px; margin: 20px 0; }
        .restart-btn { background: #1a5e44; color: white; border: none; padding: 16px 24px; border-radius: 60px; width: 100%; cursor: pointer; margin-top: 10px; font-size: 1.2rem; font-weight: bold; }
        .stats { font-size: 1.1rem; line-height: 1.8; }
        hr { margin: 15px 0; border-color: #c0d9ce; }
        @media (max-width: 640px) { .quiz-wrapper { max-width: 100%; padding: 15px; } .opt-btn { padding: 10px 20px; min-width: 120px; font-size: 1rem; } .toolbar { gap: 8px; } .tool-btn { padding: 8px 14px; font-size: 0.85rem; } .question-text { font-size: 1rem; padding: 15px; } }
    </style>
</head>
<body>
<div class="quiz-wrapper">
    <div id="introScreen" class="screen active intro-card">
        <h1>⚓ Conquista e colonização portuguesa</h1>
        <div class="revisao">Quiz · Bloco 3 · 20 questões</div>
        <div class="professora">Professora Angela Siqueira</div>
        <button class="btn-iniciar" id="startQuizBtn">▶ Iniciar Quiz</button>
    </div>

    <div id="quizScreen" class="screen">
        <div class="title">🎯 Verdadeiro ou Falso?</div>
        <div class="sub">Indígenas · Ocupação · Produção · Administração · Escravidão · Igreja · Arte</div>
        <div class="progress-row">
            <span id="progressText">Questão 1 de 20</span>
            <span id="scoreDisplay">✅ 0 acertos</span>
        </div>
        <div class="progress-bar-bg"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>
        <div id="questionArea">
            <div id="questionText" class="question-text"></div>
            <div class="options" id="optionsArea">
                <button class="opt-btn" id="trueBtn">✅ VERDADEIRO</button>
                <button class="opt-btn" id="falseBtn">❌ FALSO</button>
            </div>
            <div id="feedbackArea" class="feedback hidden"></div>
        </div>
        <div class="toolbar">
            <button class="tool-btn" id="fontMinusBtn">A−</button>
            <button class="tool-btn" id="fontPlusBtn">A+</button>
            <button class="tool-btn" id="fullscreenBtn">⛶ Tela cheia</button>
            <button class="tool-btn" id="prevBtn" disabled>◀ Anterior</button>
            <button class="tool-btn" id="nextBtn" disabled>Próxima ▶</button>
        </div>
    </div>

    <div id="resultScreen" class="screen result-screen">
        <h2>📊 Estatística da sua pontuação</h2>
        <div class="result-box" id="resultContent"></div>
        <button class="restart-btn" id="restartQuizBtn">🔄 Refazer quiz</button>
    </div>
</div>

<script>
    const questions = [
        { text: "As 'Guerras Justas' eram conflitos autorizados pelo rei de Portugal para escravizar indígenas que se recusavam a se submeter.", answer: true, justification: "As Guerras Justas permitiam a escravização de indígenas em conflitos declarados, como forma de dominação." },
        { text: "A Lei de 1570 proibia totalmente a escravização de indígenas no Brasil.", answer: false, justification: "A Lei de 1570 limitava a escravização a casos de Guerra Justa, canibalismo ou recusa à submissão, mas era frequentemente desrespeitada." },
        { text: "As missões jesuíticas protegiam os indígenas da escravização, mas também os controlavam e impunham a religião católica.", answer: true, justification: "As missões tinham caráter ambíguo: protegiam, mas também controlavam e catequizavam os indígenas." },
        { text: "A Confederação dos Tamoios (1554–1567) foi uma aliança de tribos indígenas contra os colonizadores no litoral de São Paulo e Rio de Janeiro.", answer: true, justification: "Os Tamoios uniram-se para resistir à colonização portuguesa, atacando vilas e engenhos." },
        { text: "A ocupação do interior do Brasil foi feita principalmente por meio de 'bandeiras' organizadas pelos jesuítas.", answer: false, justification: "As bandeiras eram expedições organizadas por particulares (bandeirantes paulistas) para apresar indígenas e buscar metais." },
        { text: "O Tratado de Madri (1750) reconheceu a ocupação efetiva do interior do Brasil, definindo as atuais fronteiras.", answer: true, justification: "O Tratado de Madri substituiu Tordesilhas e estabeleceu as fronteiras com base no princípio do 'uti possidetis'." },
        { text: "O ciclo do ouro (séc. XVIII) foi a primeira atividade econômica de exportação do Brasil colonial.", answer: false, justification: "O primeiro produto de exportação foi o pau-brasil, seguido pelo açúcar, e depois o ouro." },
        { text: "O sistema de plantation (latifúndio, monocultura, escravidão) foi característico da produção de açúcar no Nordeste.", answer: true, justification: "O açúcar era produzido em grandes propriedades com monocultura e mão-de-obra escrava, voltado para a exportação." },
        { text: "A pecuária no sertão nordestino e no Sul foi fundamental para a ocupação do interior e o abastecimento das minas.", answer: true, justification: "A pecuária fornecia carne, couro e transporte, sendo essencial para a economia colonial." },
        { text: "A administração colonial do Brasil foi centralizada no Governo-Geral desde o início da colonização em 1500.", answer: false, justification: "O Governo-Geral foi criado em 1549, com sede em Salvador; antes, a administração era fragmentada pelas capitanias hereditárias." },
        { text: "As câmaras municipais eram controladas pelos 'homens bons', grandes proprietários e comerciantes, representando a elite local.", answer: true, justification: "As câmaras municipais eram oligarquias locais, que administravam as vilas e cidades em benefício da elite." },
        { text: "A sociedade colonial era hierárquica, com os 'reinóis' (nascidos em Portugal) no topo e os escravos negros na base.", answer: true, justification: "A hierarquia social era baseada na origem e na cor da pele, com privilégios para os brancos." },
        { text: "A escravidão africana substituiu a indígena porque os africanos eram mais resistentes às doenças e mais lucrativos.", answer: true, justification: "A escravidão africana tornou-se predominante devido à resistência indígena, às epidemias e à maior lucratividade do tráfico negreiro." },
        { text: "O quilombo de Palmares foi destruído em 1694, e seu líder Zumbi tornou-se símbolo da resistência negra.", answer: true, justification: "Palmares foi o maior quilombo do Brasil, e Zumbi é um herói nacional, símbolo da luta contra a escravidão." },
        { text: "A Lei Áurea (1888) foi assinada durante o período colonial, libertando os escravos no Brasil.", answer: false, justification: "A Lei Áurea foi assinada em 1888, já no Império, e não no período colonial." },
        { text: "A Igreja Católica, especialmente os jesuítas, teve um papel central na catequese e na educação dos indígenas.", answer: true, justification: "A Igreja promoveu a catequese, fundou escolas e colégios, sendo uma das instituições mais poderosas da colônia." },
        { text: "O sincretismo religioso na colônia resultou da mistura de elementos católicos, indígenas e africanos.", answer: true, justification: "O sincretismo foi uma forma de resistência cultural, associando santos católicos a divindades africanas e indígenas." },
        { text: "A arte barroca brasileira, como as obras de Aleijadinho, expressou o diálogo entre a cultura europeia e as influências locais.", answer: true, justification: "Aleijadinho combinou elementos barrocos europeus com técnicas e motivos locais, criando uma arte única." },
        { text: "A produção artística na colônia era exclusivamente religiosa, sem qualquer influência indígena ou africana.", answer: false, justification: "A arte colonial incorporou influências indígenas (técnicas de construção, motivos) e africanas (escultura, música)." },
        { text: "A coroa portuguesa controlava a extração de ouro por meio do imposto do 'quinto', que correspondia a 20% da produção.", answer: true, justification: "O quinto era o imposto de 20% sobre o ouro extraído, garantindo lucros à Coroa portuguesa." }
    ];

    const total = questions.length;
    let currentIndex = 0;
    let userAnswers = new Array(total).fill(null);
    let quizFontSize = 16;

    const introScreen = document.getElementById('introScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const startQuizBtn = document.getElementById('startQuizBtn');
    const restartQuizBtn = document.getElementById('restartQuizBtn');
    const questionText = document.getElementById('questionText');
    const feedbackArea = document.getElementById('feedbackArea');
    const trueBtn = document.getElementById('trueBtn');
    const falseBtn = document.getElementById('falseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressText = document.getElementById('progressText');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const progressFill = document.getElementById('progressFill');
    const resultContent = document.getElementById('resultContent');
    const fontMinusBtn = document.getElementById('fontMinusBtn');
    const fontPlusBtn = document.getElementById('fontPlusBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    function updateScoreDisplay() {
        let correct = 0;
        for (let i = 0; i < total; i++) if (userAnswers[i] !== null && userAnswers[i] === questions[i].answer) correct++;
        scoreDisplay.textContent = `✅ ${correct} acertos`;
    }

    function applyFontSize() { document.querySelector('.quiz-wrapper').style.fontSize = quizFontSize + 'px'; }
    fontMinusBtn.addEventListener('click', () => { if (quizFontSize > 12) { quizFontSize -= 2; applyFontSize(); } });
    fontPlusBtn.addEventListener('click', () => { if (quizFontSize < 36) { quizFontSize += 2; applyFontSize(); } });
    fullscreenBtn.addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); });

    function resetStyles() {
        trueBtn.classList.remove('selected-true', 'correct-show', 'wrong-show');
        falseBtn.classList.remove('selected-false', 'correct-show', 'wrong-show');
    }

    function renderQuestion() {
        const q = questions[currentIndex];
        questionText.innerText = q.text;
        feedbackArea.classList.add('hidden');
        feedbackArea.className = 'feedback hidden';
        resetStyles();
        const val = userAnswers[currentIndex];
        if (val !== null) {
            if (val === true) trueBtn.classList.add('selected-true');
            else falseBtn.classList.add('selected-false');
            showFeedback(val);
        }
        progressText.innerText = `Questão ${currentIndex+1} de ${total}`;
        progressFill.style.width = ((currentIndex+1)/total*100) + '%';
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = false;
        updateScoreDisplay();
    }

    function showFeedback(val) {
        const q = questions[currentIndex];
        const isCorrect = (val === q.answer);
        resetStyles();
        if (q.answer === true) trueBtn.classList.add('correct-show');
        else falseBtn.classList.add('correct-show');
        if (!isCorrect) {
            if (val === true) trueBtn.classList.add('wrong-show');
            else falseBtn.classList.add('wrong-show');
        }
        const resp = q.answer ? "VERDADEIRO" : "FALSO";
        feedbackArea.classList.remove('hidden', 'correct', 'wrong');
        feedbackArea.classList.add(isCorrect ? 'correct' : 'wrong');
        feedbackArea.innerHTML = `<strong>${isCorrect ? '✓ Correto!' : '✗ Incorreto'}</strong><br>${q.justification}<br><span style="font-size:0.9rem;">Resposta correta: <strong>${resp}</strong></span>`;
    }

    function selectAnswer(value) {
        if (userAnswers[currentIndex] !== null) return;
        userAnswers[currentIndex] = value;
        if (value === true) trueBtn.classList.add('selected-true');
        else falseBtn.classList.add('selected-false');
        showFeedback(value);
        updateScoreDisplay();
    }

    trueBtn.addEventListener('click', () => { if (userAnswers[currentIndex] === null) selectAnswer(true); });
    falseBtn.addEventListener('click', () => { if (userAnswers[currentIndex] === null) selectAnswer(false); });

    prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(); } });
    nextBtn.addEventListener('click', () => {
        if (userAnswers[currentIndex] === null) { alert('⚠️ Responda a questão antes de avançar.'); return; }
        if (currentIndex < total - 1) { currentIndex++; renderQuestion(); }
        else mostrarResultado();
    });

    function mostrarResultado() {
        let acertos = 0;
        for (let i = 0; i < total; i++) if (userAnswers[i] === questions[i].answer) acertos++;
        const percentual = (acertos / total) * 100;
        const nota = (acertos / total) * 10;
        let mensagem = percentual >= 85 ? "⭐ Excelente! Você domina a colonização portuguesa." :
                       percentual >= 70 ? "👍 Muito bom! Reveja os tópicos que errou." :
                       percentual >= 50 ? "📘 Bom, mas pode melhorar." : "📚 Releia o capítulo sobre colonização.";
        resultContent.innerHTML = `
            <div class="stats">
                <p><strong>✅ Acertos:</strong> ${acertos} de ${total}</p>
                <p><strong>❌ Erros:</strong> ${total - acertos} de ${total}</p>
                <p><strong>📊 Percentual de acerto:</strong> ${percentual.toFixed(1)}%</p>
                <p><strong>🎓 Nota (0 a 10):</strong> ${nota.toFixed(1)}</p>
                <hr>
                <p>${mensagem}</p>
            </div>
        `;
        quizScreen.classList.remove('active');
        resultScreen.classList.add('active');
    }

    function reiniciar() {
        userAnswers = new Array(total).fill(null);
        currentIndex = 0;
        resultScreen.classList.remove('active');
        introScreen.classList.add('active');
    }
    restartQuizBtn.addEventListener('click', reiniciar);
    startQuizBtn.addEventListener('click', () => {
        introScreen.classList.remove('active');
        quizScreen.classList.add('active');
        renderQuestion();
    });
    applyFontSize();
</script>
</body>
</html>
